<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Demo Trigger Manifest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #ffffff; color: #111827; font-family: system-ui, -apple-system, sans-serif; }
        .btn-press { transition: transform 0.1s; }
        .btn-press:active { transform: scale(0.95); }
    </style>
</head>
<body class="p-6 h-screen flex flex-col justify-center">

    <div class="max-w-md mx-auto w-full">
        <h1 class="text-2xl font-black mb-1 text-center text-red-600">MAGIC TRIGGER 🪄</h1>
        <p class="text-xs text-gray-500 text-center mb-8 uppercase tracking-widest">AnterAja Demo Controller</p>

        <form id="triggerForm" class="space-y-5">
            <!-- Asal -->
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Dari (Origin)</label>
                <select id="originHub" class="w-full p-3 border-2 border-gray-200 rounded-xl bg-gray-50 font-medium outline-none focus:border-red-500">
                    <option value="">🎲 Acak (Random)</option>
                    <option value="HUB-MDN-01">Medan (MDN)</option>
                    <option value="HUB-SBY-01">Surabaya (SBY)</option>
                    <option value="HUB-BDO-01">Bandung (BDO)</option>
                    <option value="HUB-JKS-01">Jakarta (JKS)</option>
                </select>
            </div>

            <!-- Tujuan -->
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Tujuan (Destination)</label>
                <select id="destinationHub" class="w-full p-3 border-2 border-gray-200 rounded-xl bg-gray-50 font-medium outline-none focus:border-red-500" required>
                    <option value="HUB-JKS-01">Jakarta (JKS)</option>
                    <option value="HUB-BDO-01">Bandung (BDO)</option>
                    <option value="HUB-SBY-01">Surabaya (SBY)</option>
                    <option value="HUB-MDN-01">Medan (MDN)</option>
                </select>
            </div>

            <!-- ETA -->
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">ETA (Menit)</label>
                <input type="number" id="etaMinutes" value="10" class="w-full p-3 border-2 border-gray-200 rounded-xl bg-gray-50 font-medium outline-none focus:border-red-500" required>
            </div>

            <!-- Total Paket -->
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Total Paket</label>
                <input type="number" id="totalPackages" value="150" max="150" class="w-full p-3 border-2 border-gray-200 rounded-xl bg-gray-50 font-medium outline-none focus:border-red-500" required>
            </div>

            <!-- Token JWT -->
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">JWT Token</label>
                <input type="text" id="jwtToken" placeholder="Paste token JWT admin disini..." class="w-full p-3 border-2 border-gray-200 rounded-xl bg-gray-50 font-medium outline-none focus:border-red-500 text-xs" required>
            </div>

            <div class="pt-6">
                <button type="submit" id="submitBtn" class="btn-press w-full bg-red-600 text-white font-black text-lg py-4 rounded-2xl shadow-[0_8px_0_rgb(185,28,28)] active:shadow-[0_0px_0_rgb(185,28,28)] active:translate-y-2 uppercase tracking-wide">
                    🚀 TEMBAK SEKARANG
                </button>
            </div>
        </form>
    </div>

    <!-- Modal Success/Error -->
    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full text-sm font-bold shadow-2xl transition-all duration-300 opacity-0 pointer-events-none scale-90 z-50 whitespace-nowrap">
        Memproses...
    </div>

    <script>
        document.getElementById('triggerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const toast = document.getElementById('toast');
            const origin = document.getElementById('originHub').value;
            const dest = document.getElementById('destinationHub').value;
            const eta = document.getElementById('etaMinutes').value;
            const packages = document.getElementById('totalPackages').value;
            const token = document.getElementById('jwtToken').value;

            btn.disabled = true;
            btn.innerHTML = 'MENGIRIM...';

            const payload = {
                destination_hub_id: dest,
                eta_offset_minutes: parseInt(eta),
                total_packages: parseInt(packages)
            };

            if (origin) payload.origin_hub_id = origin;

            try {
                // Tembak API (menyesuaikan config nginx reverse proxy yang membuang prefix '/anter-aja-backend/')
                const res = await fetch('/anter-aja-backend/api/v1/manifests/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok) {
                    showToast('✅ Berhasil: ' + data.data.manifest_code, 'bg-green-600');
                } else {
                    showToast('❌ Error: ' + (data.message || 'Gagal generate'), 'bg-red-600');
                }
            } catch (err) {
                showToast('❌ Gagal menghubungi server', 'bg-red-600');
            } finally {
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = '🚀 TEMBAK SEKARANG';
                }, 1000);
            }
        });

        function showToast(text, bgClass) {
            const toast = document.getElementById('toast');
            toast.className = `fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-sm font-bold shadow-2xl transition-all duration-300 z-50 whitespace-nowrap ${bgClass} opacity-100 scale-100`;
            toast.innerText = text;

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'scale-100');
                toast.classList.add('opacity-0', 'scale-90');
            }, 3000);
        }
    </script>
</body>
</html>
