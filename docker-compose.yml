services:
  anteraja-hub:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: anteraja-hub-admin:latest
    container_name: anteraja-hub-admin
    restart: unless-stopped
    ports:
      - "5176:80"
    networks:
      - nginx-network

networks:
  nginx-network:
    external: true
    name: nginx-network

