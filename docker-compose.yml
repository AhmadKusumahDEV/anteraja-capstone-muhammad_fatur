services:
  app_setup:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: anteraja_app_setup
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres_db_anteraja
      DB_PORT: 5432
      DB_DATABASE: mydatabase
      DB_USERNAME: main
      DB_PASSWORD: example
    command: sh -c "composer install && [ -f .env ] || cp .env.example .env && chmod -R 775 storage bootstrap/cache && chown -R www-data:www-data storage bootstrap/cache && php artisan key:generate --force && php artisan migrate --force && php artisan db:seed --force"
    depends_on:
      postgres_db_anteraja:
        condition: service_healthy
    networks:
      - backend-net

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: anteraja_server
    restart: unless-stopped
    user: www-data
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres_db_anteraja
      # DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_DATABASE: mydatabase
      DB_USERNAME: main
      DB_PASSWORD: example
    depends_on:
      app_setup:
        condition: service_completed_successfully
      postgres_db_anteraja:
        condition: service_healthy
    networks:
      - backend-net

  web:
    image: nginx:alpine
    container_name: anteraja_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - backend-net

  postgres_db_anteraja:
    image: postgres:15-alpine
    container_name: postgres_db_anteraja
    restart: unless-stopped
    environment:
      - POSTGRES_USER=main
      - POSTGRES_PASSWORD=example
      - POSTGRES_DB=mydatabase
    ports:
      - "5552:5432"
    networks:
      - backend-net
    volumes:
      - postgres_data_anter_aja:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U main -d mydatabase" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend-net:
    name: backend-net
    external: true

volumes:
  postgres_data_anter_aja:
        driver: local
