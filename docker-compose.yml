version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: anteraja_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_DATABASE: mydatabase
      DB_USERNAME: main
      DB_PASSWORD: example
    command: sh -c "php artisan migrate --force --seed && php-fpm"
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - backend-net

  web:
    image: nginx:alpine
    container_name: anteraja_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - backend-net

  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=main
      - POSTGRES_PASSWORD=example
      - POSTGRES_DB=mydatabase
    ports:
      - "5552:5432"
    networks:
      - backend-net
    volumes:
      - postgres_data_anter_aja:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U main -d mydatabase" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend-net:
    external: true
    name: backend-net

volumes:
  postgres_data_anter_aja:
