services:
  app_setup:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: anteraja_app_setup
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres_db_anteraja
      DB_PORT: 5432
      DB_DATABASE: mydatabase
      DB_USERNAME: main
      DB_PASSWORD: example
    command: sh -c "composer install && chmod -R 775 storage bootstrap/cache && chown -R www-data:www-data storage bootstrap/cache && php artisan key:generate && php artisan migrate --force && php artisan db:seed --force"
    depends_on:
      postgres_db_anteraja:
        condition: service_healthy
    networks:
      - backend-net

  # 4. Aplikasi Backend Utama (PHP-FPM)
  app:
    image: anteraja-php:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod  # <-- Kita ubah ke prod dulu agar jalan mulus
    container_name: anteraja_server
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres_db_anteraja
      DB_PORT: "5432"
      REDIS_HOST: redis_anteraja
    networks:
      - backend-net
    volumes:
      # -----------------------------------------------------
      # UNCOMMENT BARIS DI BAWAH INI JIKA MENGGUNAKAN TARGET: dev
      # - ./:/var/www/html
      # -----------------------------------------------------
      - storage_data:/var/www/html/storage
    depends_on:
      postgres_db_anteraja:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect localhost:9000 | grep -q pong"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # 4.5. Queue Worker (Asynchronous Background Job)
  queue:
    image: anteraja-php:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    container_name: anteraja_queue
    restart: unless-stopped
    user: www-data
    working_dir: /var/www/html
    volumes:
      - storage_data:/var/www/html/storage
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres_db_anteraja
      DB_PORT: "5432"
      REDIS_HOST: redis_anteraja
    networks:
      - backend-net
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3"]
    depends_on:
      postgres_db_anteraja:
        condition: service_healthy
      redis_anteraja:
        condition: service_healthy

  # 4.6. Scheduler (Cron Job)
  scheduler:
    image: anteraja-php:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    container_name: anteraja_scheduler
    restart: unless-stopped
    user: www-data
    working_dir: /var/www/html
    volumes:
      - storage_data:/var/www/html/storage
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres_db_anteraja
      DB_PORT: "5432"
      REDIS_HOST: redis_anteraja
    networks:
      - backend-net
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres_db_anteraja:
        condition: service_healthy
      redis_anteraja:
        condition: service_healthy

  # 5. Web Server (Nginx)
  web:
    image: nginx:alpine
    container_name: anteraja_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    networks:
      - backend-net
    depends_on:
      app:
        condition: service_healthy

  postgres_db_anteraja:
    image: postgres:15-alpine
    container_name: postgres_db_anteraja
    restart: unless-stopped
    environment:
      - POSTGRES_USER=main
      - POSTGRES_PASSWORD=example
      - POSTGRES_DB=mydatabase
    ports:
      - "5552:5432"
    networks:
      - backend-net
    volumes:
      - postgres_data_anter_aja:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U main -d mydatabase" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend-net:
    name: backend-net
    external: true

volumes:
  postgres_data_anter_aja:
        driver: local
