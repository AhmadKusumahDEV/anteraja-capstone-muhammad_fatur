services:
  # 1. Database PostgreSQL
  postgres_db_anteraja:
    image: postgres:15-alpine
    container_name: postgres_db_anteraja
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "5552:5432"
    volumes:
      - postgres_data_anter_aja:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis (Siap digunakan kapan saja)
  redis_anteraja:
    image: redis:7-alpine
    container_name: anteraja_redis
    restart: unless-stopped
    volumes:
      - redis_data_anter_aja:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Job Sekali Jalan: Menjalankan "php artisan migrate --seed"
  migrate:
    image: anteraja-php:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod  # <-- Kita ubah ke prod dulu agar jalan mulus
    container_name: anteraja_migrate
    user: www-data
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres_db_anteraja
      DB_PORT: "5432"
      REDIS_HOST: redis_anteraja
    networks:
      - backend-net
    command: ["php", "artisan", "migrate", "--force", "--seed"]
    restart: "no"
    depends_on:
      postgres_db_anteraja:
        condition: service_healthy

  # 4. Aplikasi Backend Utama (PHP-FPM)
  app:
    image: anteraja-php:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod  # <-- Kita ubah ke prod dulu agar jalan mulus
    container_name: anteraja_server
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres_db_anteraja
      DB_PORT: "5432"
      REDIS_HOST: redis_anteraja
    networks:
      - backend-net
    volumes:
      # -----------------------------------------------------
      # UNCOMMENT BARIS DI BAWAH INI JIKA MENGGUNAKAN TARGET: dev
      # - ./:/var/www/html
      # -----------------------------------------------------
      - storage_data:/var/www/html/storage
    depends_on:
      postgres_db_anteraja:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect localhost:9000 | grep -q pong"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # 4.5. Queue Worker (Asynchronous Background Job)
  queue:
    image: anteraja-php:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    container_name: anteraja_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - storage_data:/var/www/html/storage
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres_db_anteraja
      DB_PORT: "5432"
      REDIS_HOST: redis_anteraja
    networks:
      - backend-net
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3"]
    depends_on:
      postgres_db_anteraja:
        condition: service_healthy
      redis_anteraja:
        condition: service_healthy

  # 4.6. Scheduler (Cron Job)
  scheduler:
    image: anteraja-php:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    container_name: anteraja_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - storage_data:/var/www/html/storage
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres_db_anteraja
      DB_PORT: "5432"

  # 5. Web Server (Nginx)
  web:
    image: nginx:alpine
    container_name: anteraja_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    networks:
      - backend-net
    depends_on:
      app:
        condition: service_healthy

# =============================================================================
#  Konfigurasi Network & Volume
# =============================================================================

networks:
  backend-net:
    name: backend-net
    external: true

volumes:
  postgres_data_anter_aja:
    driver: local
  storage_data:
  redis_data_anter_aja:
