services:
  anteraja-hub:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: anteraja-hub-admin:latest
    container_name: anteraja-hub-admin
    restart: unless-stopped
    ports:
      - "5176:80"
    networks:
      - frontend-net

networks:
  frontend-net:
    external: true          # Network ini sudah ada, dikelola oleh Nginx Anda
    name: frontend-net     # Sesuaikan dengan nama network Nginx Anda (lihat: docker network ls)
