<!DOCTYPE html>
<html>
<head>
    <title>Shipment Map Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #map { height: 600px; width: 100%; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); }
        .info-window { font-size: 14px; padding: 5px; }
    </style>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD1p7celaXU__6xYv53yTi_N__RL__P9mY&callback=initMap" async defer></script>
    <script>
        let map;
        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: -6.2088, lng: 106.8456 },
                zoom: 12,
            });

            const shipments = [
                { tracking: "PKG-001", lat: -6.2146, lng: 106.8451, status: "In Transit" },
                { tracking: "PKG-002", lat: -6.1931, lng: 106.8218, status: "Delivered" },
                { tracking: "PKG-003", lat: -6.2253, lng: 106.8021, status: "Pending" }
            ];

            const infoWindow = new google.maps.InfoWindow();

            shipments.forEach(shipment => {
                const marker = new google.maps.Marker({
                    position: { lat: shipment.lat, lng: shipment.lng },
                    map: map,
                    title: shipment.tracking
                });

                marker.addListener("click", () => {
                    infoWindow.setContent(`<div class="info-window"><b>📦 Tracking:</b> ${shipment.tracking}<br><b>🚚 Status:</b> ${shipment.status}</div>`);
                    infoWindow.open(map, marker);
                });
            });
        }
    </script>
</head>
<body>
    <h2>Tracking Dashboard - Shipment & Courier</h2>
    <p>Silakan klik pada pin/marker (merah atau biru) untuk melihat Info Window.</p>
    <div id="map"></div>
</body>
</html>
