[www]
; Mengaktifkan fitur healthcheck ping agar Docker tahu container sehat
ping.path = /ping
ping.response = pong

; Setting agar error log bisa masuk ke sistem Docker
catch_workers_output = yes
decorate_workers_output = no

; --- PHP-FPM Worker Settings ---
; dynamic = jumlah worker menyesuaikan beban
pm = dynamic
; max_children = batas maksimal worker (1 worker = 1 koneksi SSE aktif)
pm.max_children = 50
; start_servers = jumlah worker yang langsung jalan saat start
pm.start_servers = 5
; min_spare_servers = minimal worker nganggur yang dipertahankan
pm.min_spare_servers = 5
; max_spare_servers = maksimal worker nganggur
pm.max_spare_servers = 35
; max_requests = restart worker setelah X request untuk cegah memory leak
pm.max_requests = 1000

